# Local dev database only. API and web run on your machine (see README).
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: futa
      POSTGRES_PASSWORD: futa_dev_password
      POSTGRES_DB: futa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U futa -d futa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
