name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: futa
          POSTGRES_PASSWORD: futa_ci
          POSTGRES_DB: futa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U futa -d futa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://futa:futa_ci@localhost:5432/futa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: pip install -r api/requirements.txt
      - name: Lint
        run: ruff check api db
      - name: Migrations apply cleanly (and are re-runnable)
        run: |
          python db/migrate.py
          python db/migrate.py
      - name: Tests (includes the OpenAPI contract check)
        working-directory: api
        run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: API types are in sync with docs/openapi.yaml
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm run build
      - name: First-load bundle budget
        run: npm run check:bundle
